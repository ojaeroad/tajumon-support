<!doctype html>
<html lang="ko">
<head>

  <title>타점ON 고객지원</title>

  <style>

    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.65}
    main{width:min(720px,calc(100% - 32px));margin:56px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px;box-shadow:0 3px 12px rgba(0,0,0,.035)}

  </style>
</head>
<body><main>
  <strong>타점ON · Tajum ON</strong>

  </section>
  <section class="card">

    <p><strong>기본:</strong> support.tajumon@gmail.com</p>
    <p><strong>보조:</strong> tajumon.help@gmail.com</p>
    <p class="small">계정 삭제 요청은 두 주소 중 어느 쪽으로 보내도 접수할 수 있습니다.</p>
  </section>
